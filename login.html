<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Alejandro Guadalupe">
    <title>Iniciar Sesión</title>
    <meta name="description" content="Iniciar sesión con tu cuenta.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
<script src="js/auth.js"></script>

<h2>Iniciar Sesión</h2>

    <form id ="login">
    <label for="email">Email</label>
    <br>
    <input type="email" id ="correo_electronico" placeholder="introduzca el email" required>
    <br>
    <label for="contraseña">Contraseña</label>
    <br>
    <input type="password" id="contraseña" placeholder="introduzca la contraseña" required>
    <br>
    <button class="boton" type="button" onclick="iniciar_sesion(correo_electronico.value, contraseña.value)">Enviar</button>
    <br>
    <a href="register.html"><button class="boton" type="button">Registrarse</button></a>
    </form>

</body>
</html>
