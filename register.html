<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Alejandro Guadalupe">
    <title>Registrarse</title>
    <meta name="description" content="Crear una cuenta en el sitio.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>
<script src="js/auth.js"></script>

<h2>Registrarse</h2>
    <form id ="registro">
    <label for="usuario">Usuario</label>
    <br>
    <input type="text" id ="nombre" placeholder="introduzca un usuario" required>
    <br> 
    <label for="email">Email</label>
    <br>
    <input type="email" id ="correo_electronico" placeholder="introduzca el email" required>
    <br>
    <label for="lat">latitud</label>
    <br>
    <input type="number" id="latitud" placeholder="introduzca la latitud" required>
    <br>
    <label for="alt">altitud</label>
    <br>
    <input type="number" id="longitud" placeholder="introduzca la altitud" required>
    <br>
    <label for="contraseña">Contraseña</label>
    <br>
    <input type="password" id="contraseña1" placeholder="introduzca la contraseña" required>
    <br>
    <label for="contraseña">confirmacion de Contraseña</label>
    <br>
    <input type="password" id="contraseña2" placeholder="introfuzca la contraseña" required>
    <br>
    <button class="boton" type="button" onclick="registrarse(nombre.value, correo_electronico.value, contraseña1.value, latitud.value, longitud.value)">Enviar</button>
    </form>


</body>
</html>
