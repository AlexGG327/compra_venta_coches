<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Alejandro Guadalupe">
    <title>Registrarse</title>
    <meta name="description" content="Crear una cuenta en el sitio.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
<script src="js/auth.js"></script>

<nav class="navbar navbar-expand-sm bg-dark navbar-dark fixed-top">
    <div class="container-fluid">
        <a class="navbar-brand" href="coches.html"><img src="img/icono.png" class="img-rounded" alt="Logotipo" height="50" width="50"></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>
    </div>
</nav>

<br><br><br><br><br>

<form>
    <div>
        <label>Nombre de usuario:</label><br>
        <input type="text" id="nombre" required>
    </div>

    <div>
        <label>Correo electrónico:</label><br>
        <input type="email" id="correo_electronico" required>
    </div>

    <div>
        <label>Ubicación (Coordenadas: latitud):</label><br>
        <input type="number" id="longitud" required>
    </div>

    <div>
        <label>Ubicación (Coordenadas: longitud):</label><br>
        <input type="number" id="latitud" required>
    </div>

    <div>
        <label>Contraseña:</label><br>
        <input type="text" id="contraseña1" required>
    </div>

    <div>
        <label>Confirmación de contraseña:</label><br>
        <input type="text" id="contraseña2" required>
    </div>
</form>

<button type="button" onclick="registrarse(nombre.value, correo_electronico.value, contraseña1.value, latitud.value, longitud.value)">Enviar</button>

</body>
</html>
